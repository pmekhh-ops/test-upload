<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>測試頁面</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #00428B;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      color: #231815;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .accent {
      color: #F1BC1A;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>這是一個 <span class="accent">GitHub 上傳測試</span> 頁面</h1>
    <p>如果你能在瀏覽器看到這個畫面，代表上傳成功！</p>
  </div>
</body>
</html>
